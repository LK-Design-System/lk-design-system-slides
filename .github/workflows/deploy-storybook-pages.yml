name: Deploy Storybook to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Storybook
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.17.1
          cache: npm

      # Core/Theme/Product are installed from the vendored tarballs in vendor/,
      # so a clean CI install never needs the private registry.
      - name: Install dependencies
        run: npm.cmd ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Static ownership gate first: it is the cheapest check and a violation
      # (a component reading the upstream ramp directly) renders fine in every
      # story, so the play runner below would not catch it.
      - name: Check style ownership
        run: npm run check:style-ownership

      # catalogue.json is generated from the component docstrings and
      # signatures. It is committed so consumers can read it without a build,
      # which means it can be committed stale — this is the check that it is not.
      - name: Check the catalogue matches source
        run: npm run check:catalogue

      - name: Build Storybook
        run: npm run build:storybook

      # The play functions are where the expression contracts are enforced, so
      # they gate the deploy: a build that violates one never reaches Pages.
      # Chromium is installed explicitly because the runner image ships no
      # Playwright browsers, and only Chromium is needed.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run story play assertions
        run: npm run check:story-play

      # A clipped slide renders and asserts perfectly well — the content is
      # simply below the frame. Only a measurement catches it, so it gates the
      # deploy alongside the play functions.
      - name: Check slides fit their canvas
        run: npm run check:slide-overflow

      # Content discipline with numbers — noun-final titles, governing shape,
      # bullet and body caps, sources on data slides. The thresholds and their
      # sources (Alley, tahta, academic-pptx-skill) live at the top of the
      # script; the judgement calls without numbers stay in qa/rubric.md.
      - name: Check deck content discipline
        run: npm run check:deck-content

      - name: Include third-party notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force storybook-static/licenses | Out-Null
          Copy-Item -LiteralPath node_modules/@lk-robotics/lds-core/THIRD_PARTY_NOTICES.md -Destination storybook-static/licenses/lds-core-THIRD_PARTY_NOTICES.md
          Copy-Item -LiteralPath node_modules/@lk-robotics/lds-product/THIRD_PARTY_NOTICES.md -Destination storybook-static/licenses/lds-product-THIRD_PARTY_NOTICES.md
          Copy-Item -LiteralPath node_modules/@lk-robotics/lds-theme/THIRD_PARTY_NOTICES.md -Destination storybook-static/licenses/lds-theme-THIRD_PARTY_NOTICES.md

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: storybook-static

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
